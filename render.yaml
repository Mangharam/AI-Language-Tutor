services:
  - type: web
    name: ai-language-tutor-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://ai-language-tutor-lilac.vercel.app
      - key: ALLOWED_ORIGIN_REGEX
        value: https://ai-language-tutor.*\.vercel\.app
